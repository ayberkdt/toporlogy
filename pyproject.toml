[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toporlogy"
version = "0.2.0"
description = "Modular density-based topology optimisation on regular 2-D/3-D grids: differentiable FEM, OC/MMA, manufacturing and connectivity constraints, multigrid, post-processing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "torch>=2.2", "pyyaml>=6"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
post = ["pyvista>=0.43", "vtk>=9.2", "numba>=0.59"]   # numba: post/sdf.py, post/checks.py (module-level import)
fast = ["pypardiso>=0.4"]
mesh = ["gmsh>=4.11"]
dev = ["pytest>=8", "pytest-timeout", "hypothesis>=6", "mypy>=1.10", "ruff>=0.5"]

[project.scripts]
toporlogy = "toporlogy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toporlogy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib -ra"
timeout = 900
markers = ["slow: long-running benchmark (deselect with -m 'not slow')",
           "baseline: bitwise comparison of the examples with tests/toporlogy/baseline (run with -m baseline)"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "PIE", "RET", "SIM"]
ignore = ["E741", "E731", "S101", "RET504", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
# PARDISO must be loaded before torch is imported (duplicate libiomp5md otherwise aborts the process)
"src/toporlogy/__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["toporlogy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
