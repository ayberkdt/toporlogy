# Tests on every pull request and on pushes to main (docs/gelistirme_plani.md G9).
# Not run here: the slow sweeps (-m slow, hours, gmsh) and the bitwise baseline (-m baseline): its determinism was
# measured on one Windows machine with SuperLU only, so another OS or BLAS could give false alarms.
name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: System libraries for vtk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxrender1

      - name: Install (CPU torch, post and dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[post,dev]"

      - name: Ruff
        run: python -m ruff check src/toporlogy tests/toporlogy

      - name: Tests (not slow)
        run: python -m pytest tests/toporlogy -m "not slow" -q

  mypy:
    name: mypy (no errors)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[post,dev]"
      - name: mypy
        run: python -m mypy src/toporlogy
