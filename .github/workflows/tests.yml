# Tests on every pull request and on pushes to main (docs/gelistirme_plani.md G9, yol_haritasi PR-04).
# Every run writes an environment and verification report (versions, BLAS, optional backends VERIFIED / NOT VERIFIED)
# kept as an artifact. Optional backends (PARDISO, gmsh/T10) and the baseline in numerical mode run in backends.yml;
# the slow sweeps (-m slow, hours) run by hand.
name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: System libraries for vtk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxrender1

      - name: Install (CPU torch, post and dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[post,dev]"

      - name: Ruff
        run: python -m ruff check src/toporlogy tests/toporlogy

      - name: Tests (not slow)
        env:
          TOPORLOGY_ENV_REPORT: env-report-${{ matrix.os }}-py${{ matrix.python }}.json
        run: python -m pytest tests/toporlogy -m "not slow" -q

      - name: Keep the environment and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env-report-${{ matrix.os }}-py${{ matrix.python }}
          path: env-report-*.json
          if-no-files-found: warn

  mypy:
    name: mypy (no errors)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[post,dev]"
      - name: mypy
        run: python -m mypy src/toporlogy
