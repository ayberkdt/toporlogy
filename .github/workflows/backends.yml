# Optional backends and the cross-platform baseline (yol_haritasi PR-04). A backend whose tests are skipped is
# reported NOT VERIFIED in the run's "verification status" section and in the report artifact, never as passed.
# CUDA: no GPU runner here, so the CUDA path stays NOT VERIFIED in CI.
name: backends

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"                 # Mondays 03:00 UTC
  pull_request:
    paths:
      - .github/workflows/backends.yml
      - src/toporlogy/solvers/**
      - src/toporlogy/fem/**
      - src/toporlogy/post/**
      - tests/toporlogy/conftest.py
      - tests/toporlogy/_verification.py
      - tests/toporlogy/test_baseline*.py
      - tests/toporlogy/baseline/**

concurrency:
  group: backends-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pardiso:
    name: PARDISO (pypardiso + MKL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for vtk (collection imports the post modules)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxrender1
      - name: Install (CPU torch, post, fast = pypardiso, dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[post,fast,dev]"
      - name: PARDISO tests
        env:
          TOPORLOGY_ENV_REPORT: env-report-pardiso.json
        run: python -m pytest tests/toporlogy -m pardiso -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: env-report-pardiso
          path: env-report-pardiso.json

  gmsh:
    name: gmsh / T10 re-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for gmsh and vtk
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1
      # fast = pypardiso: the T10 re-analysis factors up to ~210k DOFs. SuperLU took 394 s on the 62k-DOF mesh of
      # test_t10_convergence and had not finished the 212k-DOF one after 45 min; PARDISO solves them in 1.3 s and 9.4 s.
      - name: Install (CPU torch, post, mesh, fast = pypardiso, dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[post,mesh,fast,dev]"
      - name: gmsh tests (slow ones included)
        env:
          TOPORLOGY_ENV_REPORT: env-report-gmsh.json
        run: python -m pytest tests/toporlogy -m gmsh -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: env-report-gmsh
          path: env-report-gmsh.json

  baseline:
    name: baseline (numerical mode on Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for vtk
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxrender1
      - name: Install (CPU torch, post and dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[post,dev]"
      - name: Baseline (bitwise only in the reference environment; here scalars to a tolerance)
        env:
          TOPORLOGY_ENV_REPORT: env-report-baseline.json
        run: python -m pytest tests/toporlogy/test_baseline.py -m baseline -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: env-report-baseline
          path: env-report-baseline.json

  slow:
    # The pre-registered slow checks (full example runs, refinement sweeps, 3-D manufactured solutions; 08 §2
    # "scheduled heavy tests"). Only on the schedule and by hand: they take hours, not every pull request.
    name: slow checks (scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for vtk
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxrender1
      - name: Install (CPU torch, post and dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[post,dev]"
      - name: Slow checks (gmsh and PARDISO ones run in their own jobs)
        env:
          TOPORLOGY_ENV_REPORT: env-report-slow.json
        run: python -m pytest tests/toporlogy -m "slow and not gmsh and not pardiso" -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: env-report-slow
          path: env-report-slow.json
